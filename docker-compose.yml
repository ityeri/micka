services:
  redis:
    image: redis:latest
    container_name: micka-redis_store
    restart: unless-stopped
    environment:
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY}
      REDIS_MAXMEMORY_POLICY: ${REDIS_MAXMEMORY_POLICY}
    ports:
      - "0.0.0.0:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - network

networks:
  network:
    driver: bridge

volumes:
  redis-data:
